<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cyberlesik</title>
    <link rel="icon" type="image/png" href="media/assets/favicon.png"">

    <!-- Pinyon Script font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Pinyon+Script&display=swap"
        rel="stylesheet"
    >

    <link type="text/css" href="https://cdnjs.cloudflare.com/ajax/libs/overlayscrollbars/2.4.5/styles/overlayscrollbars.min.css" rel="stylesheet" />

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =================================================
         PAGE 1
    ================================================== -->

    <section class="page" id="home">

        <!-- Background -->
        <img
            src="media/assets/background.png"
            class="background"
            alt=""
        >

        <!-- Top lace -->
        <img
            src="media/assets/lace.png"
            class="lace top-lace"
            alt=""
        >

        <!-- Bottom lace -->
        <img
            src="media/assets/lace.png"
            class="lace bottom-lace"
            alt=""
        >

        <!-- Main content -->
        <main class="content">

            <!-- Stripe with bow -->
            <div class="stripe">

                <span class="line"></span>

                <img
                    src="media/assets/bow.png"
                    class="bow"
                    alt="Bow"
                >

                <span class="line"></span>

            </div>


            <img
                src="media/logo/cyberlesik.png"
                class="cyberlesik"
                style="width: 95vw !important; max-width: 700px !important;"
                alt="Cyberlesik"
            >


            <!-- Social buttons -->
            <div class="socials">

                <a href="https://www.linkedin.com/in/alesya-yarmosh/" class="social">
                    <img
                        src="media/socials/linkedin.png"
                        alt="LinkedIn"
                    >
                </a>

                <a href="media/socials/cv.png" class="social">
                    <img
                        src="media/socials/cv.png"
                        alt="CV"
                    >
                </a>

                <a href="https://github.com/lesik248" class="social">
                    <img
                        src="media/socials/github.png"
                        alt="GitHub"
                    >
                </a>

                <a href="mailto:alesya.yarmosh24@gmail.com" class="social">
                    <img
                        src="media/socials/email.png"
                        alt="Email"
                    >
                </a>

            </div>

        </main>

    </section>



    <!-- =================================================
         PAGE 2
    ================================================== -->

    <section class="page" id="quote">

        <!-- Background -->
        <img
            src="media/assets/background.png"
            class="background"
            alt=""
        >

        <!-- Top lace -->
        <img
            src="media/assets/lace.png"
            class="lace top-lace"
            alt=""
        >

        <!-- Bottom lace -->
        <img
            src="media/assets/lace.png"
            class="lace bottom-lace"
            alt=""
        >


        <!-- Quote -->
        <main class="quote-content">

            <!-- Stripe with bow -->
            <div class="stripe">

                <span class="line"></span>

                <img
                    src="media/assets/bow.png"
                    class="bow"
                    alt="Bow"
                >

                <span class="line"></span>

            </div>


            <!-- Pinyon Script quote -->
            <h2 class="quote">
                You have nothing to lose<br>
                and everything to gain...
            </h2>

        </main>


        <!-- Copyright -->
        <div class="copyright">
            ©2026 Alesya Yarmosh
        </div>

        <a class="back-to-top" href="#home" aria-label="Back to the first page">&uarr;</a>

    </section>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/overlayscrollbars/2.4.5/browser/overlayscrollbars.browser.es6.min.js"></script>
  
  <!-- 3. Initialize the scrollbar on the entire body -->
  <script>
    const { OverlayScrollbars } = OverlayScrollbarsGlobal;
    OverlayScrollbars(document.body, {
      scrollbars: {
        autoHide: 'scroll', // Hides automatically after scrolling
        autoHideDelay: 800    // Fades out after 800ms of inactivity
      }
    });
  </script>

</body>
</html>
