<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cyberlesik</title>

    <!-- Pinyon Script font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Pinyon+Script&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =================================================
         PAGE 1
    ================================================== -->

    <section class="page" id="home">

        <!-- Background -->
        <img
            src="images/background.png"
            class="background"
            alt=""
        >

        <!-- Top lace -->
        <img
            src="images/lace-bottom.png"
            class="lace top-lace"
            alt=""
        >

        <!-- Bottom lace -->
        <img
            src="images/lace-bottom.png"
            class="lace bottom-lace"
            alt=""
        >

        <!-- Main content -->
        <main class="content">

            <!-- Stripe with bow -->
            <div class="stripe">

                <span class="line"></span>

                <img
                    src="images/bow.png"
                    class="bow"
                    alt="Bow"
                >

                <span class="line"></span>

            </div>


            <img
                src="images/cyberlesik.png"
                class="cyberlesik"
                style="width: 95vw !important; max-width: 700px !important;"
                alt="Cyberlesik"
            >


            <!-- Social buttons -->
            <div class="socials">

                <a href="https://www.linkedin.com/in/alesya-yarmosh/" class="social">
                    <img
                        src="images/linkedin.png"
                        alt="LinkedIn"
                    >
                </a>

                <a href="files/cv.pdf" class="social">
                    <img
                        src="images/cv.png"
                        alt="CV"
                    >
                </a>

                <a href="https://github.com/lesik248" class="social">
                    <img
                        src="images/github.png"
                        alt="GitHub"
                    >
                </a>

                <a href="mailto:alesya.yarmosh24@gmail.com" class="social">
                    <img
                        src="images/email.png"
                        alt="Email"
                    >
                </a>

            </div>

        </main>

    </section>



    <!-- =================================================
         PAGE 2
    ================================================== -->

    <section class="page" id="quote">

        <!-- Background -->
        <img
            src="images/background.png"
            class="background"
            alt=""
        >

        <!-- Top lace -->
        <img
            src="images/lace-bottom.png"
            class="lace top-lace"
            alt=""
        >

        <!-- Bottom lace -->
        <img
            src="images/lace-bottom.png"
            class="lace bottom-lace"
            alt=""
        >


        <!-- Quote -->
        <main class="quote-content">

            <!-- Stripe with bow -->
            <div class="stripe">

                <span class="line"></span>

                <img
                    src="images/bow.png"
                    class="bow"
                    alt="Bow"
                >

                <span class="line"></span>

            </div>


            <!-- Pinyon Script quote -->
            <h2 class="quote">
                You have nothing to lose<br>
                and everything to gain...
            </h2>

        </main>


        <!-- Copyright -->
        <div class="copyright">
            ©2026 Alesya Yarmosh
        </div>

    </section>

</body>
</html>
